<!DOCTYPE html>
<html lang="sv">
  <head>
    <title>Administration</title>
    <link rel="stylesheet" href="./new.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!--HEADER-->
    <header>
      <div class="header-container">
        <h1>Administration</h1>
      </div>
    </header>
    <!--MAIN-->
    <main>
      <div class="main">
        <!--left column-->
        <div class="left-column">
          <h3>Produkter</h3>
        </div>
        <!--title-->
        <div>
          <h2>Ny produkt</h2>
        </div>
        <!--FORM-->
        <form class="form">
          <!--name-->
          <div class="row">
            <label>Namn</label><br />
            <input type="text" placeholder="" />
          </div>
          <!--textarea-->
          <div class="row">
            <label for="message">Beskrivning</label><br />
            <textarea name="message" id="message" rows="10" cols="1">
            </textarea>
          </div>
          <!--picture-->
          <div class="row">
            <label>Bild</label><br />
            <div class="pic">
              <label for="pic"
                >Välj fil...
                <input type="file" id="pic" accept="image/png, image/jpeg" />
              </label>
            </div>
          </div>
          <!--SKU-->
          <div class="row">
            <label for="sku">SKU</label><br />
            <input type="text" id="sku" placeholder="" />
          </div>
          <!--price-->
          <div class="row">
            <label for="price">Pris</label><br />
            <input type="number" id="price" placeholder="enbart siffror.." />
          </div>
          <!--checkbox kategorier-->
          <div class="row">
            <label>Kategorier</label>
            <div>
              <br />
              <label>
                <input type="checkbox" name="t-shirts" />
                T-Shirts
              </label>
            </div>
            <div>
              <label>
                <input type="checkbox" name="sommar" />
                Sommar
              </label>
            </div>
            <div>
              <label>
                <input type="checkbox" name="Byxor" />
                Byxor
              </label>
            </div>
            <div>
              <label>
                <input type="checkbox" name="skor" />
                Skor
              </label>
            </div>
          </div>
          <!--submit button-->
          <div class="button">
            <input type="submit" value="Lägg till" />
          </div>
        </form>
      </div>
    </main>
  </body>
</html>

<!DOCTYPE html>
<html lang="sv">
<head>
    <title>Administration</title>
    <link rel="stylesheet" href="./new.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1>Administration</h1>
        </div>
    </header>
    <main>
        <div class="main">
            <div class="left-column">
                <h3>Produkter</h3>
            </div>
            <div>         
            <h2>Ny produkt</h2>
            </div>  
            <form class="form">
                <div class="row">
                    <label>Namn</label><br>
                    <input type="text" placeholder=""> 
                </div>
                <div class="row">
                    <label for="message">Beskrivning</label><br>
                    <textarea name="message" id="message" rows="10" cols="30">
                        
                        </textarea> 
                </div>
                <div class="row">
                    <label for="pic">Bild</label><br>
                    <input type="file" id="pic"> 
                </div>
                <div class="row">
                    <label for="sku">SKU</label><br>
                    <input type="text" id="sku" placeholder=""> 
                </div>
                <div class="row">
                    <label for="price">Pris</label><br>
                    <input type="number" id="price" placeholder="enbart nummer"> 
                </div>
                <div class="row">
                    <h3></h3>
                    <div>
                        <label>                           
                            <input type="checkbox" name="t-shirts" />
                            T-Shirts
                        </label>
                    </div>
                    <div>
                        
                        <label>                           
                            <input type="checkbox" name="sommar" />
                            Sommar
                        </label>
                    </div>
                    <div>
                        
                        <label>                           
                            <input type="checkbox" name="Byxor" />
                            Byxor
                        </label>
                    </div>
                    <div>
                        
                        <label>                           
                            <input type="checkbox" name="skor" />
                            Skor
                        </label>
                    </div>
                </div>
                <div class="button">
                    <input type="submit" value="Submit">
                </div>
            </form>
        </div>    
    </main>
    
</body>
</html>

<!DOCTYPE html>
<html lang="sv">
<head>
    <title>Svart T-shirt</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="product-details.css">
</head>
<body>
        <!--- HEADER --->
        <header>
         <div class="header-container row">
            <!-- Logo -->
            <div class="logo-container">
                <img src="https://placehold.co/400x200/png" alt="Logo"/>
            </div>
            <!-- searchbar -->
            <div class="searchbar-container">
                <form>
                    <button><i class="bi bi-search"></i></button>
                    <input type="text" placeholder="Sök product"> 
                </form>
                <ul class="icons">
                    <li><i class="bi bi-heart-fill"></i></li>
                    <li><i class="bi bi-basket"></i></li>
                </ul>
            </div>
            <!-- Navbar -->
            <div class="navbar-container row">
                <nav>
                    <ul>
                      <li><a href="#">Nyheter</a></li>
                      <li><a href="#">Topplistan</a></li>
                      <li><a href="#">Rea</a></li>
                      <li><a href="#">Kampanjer</a></li>
                    </ul>
                </nav>       
            </div>
         </div>
        </header>
        <!-- Details -->
        <div class="details-container row">
            <div class="product-container">
                <img src ="https://placehold.co/200x300/png" alt="product">
                <div class="img-icons">
                    <i class="bi bi-heart"></i>
                </div>
                <div class="product-text info"></div>
                    <h3>Svart T-Shirt</h3>
                    <p>Levis</p>
                    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Ex reiciendis harum consequatur autem doloremque vitae nulla ducimus quos recusandae praesentium.
                    </p>
                    <h3>199 SEK</h3>
                    <button>Lägg i varukorgen</button>                   
                </div>
            </div>
        </div>
        <!-- More Products Like This -->
        <div class="products-alike-container row">
            <h2>Liknande produkter</h2>
            <div class="product-container">
                <img src ="https://placehold.co/200x300/png" alt="product" >
                <div class="product-text">
                    <h3>Svart T-Shirt</h3>
                    <h3>199 SEK</h3>
                    <p>Levis</p>
                </div>
            </div>

        </div>
    
</body>
</html>
